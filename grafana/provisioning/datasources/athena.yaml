apiVersion: 1
datasources:
  - name: Athena POC
    uid: athena-medallion
    type: grafana-athena-datasource
    access: proxy
    isDefault: true
    jsonData:
      authType: default
      defaultRegion: ${AWS_REGION}
      catalog: AwsDataCatalog
      database: medallion_it_tickets_poc
      workgroup: primary
      outputLocation: s3://${POC_BUCKET}/athena-results/
